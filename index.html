<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaqah Tracker Pro - PNG Mission</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { primary: '#10b981' } } }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-white dark:bg-gray-800 shadow-sm p-4 sticky top-0 z-20 flex justify-between items-center border-b border-gray-200 dark:border-gray-700">
        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-emerald-600 dark:text-emerald-400">
            <i class="fa-solid fa-book-open-reader mr-2"></i>Halaqah<span class="text-gray-800 dark:text-white font-light ml-1">Pro</span>
        </h1>
        <div class="flex items-center gap-2 sm:gap-3">
            <button onclick="exportJSON()" class="text-xs bg-emerald-100 text-emerald-700 dark:bg-emerald-900/50 dark:text-emerald-300 px-3 py-1.5 rounded-full font-bold shadow-sm hover:bg-emerald-200 transition flex items-center" title="Cadangkan Data">
                <i class="fa-solid fa-download sm:mr-1"></i> <span class="hidden sm:inline">Backup</span>
            </button>
            <label class="cursor-pointer text-xs bg-indigo-100 text-indigo-700 dark:bg-indigo-900/50 dark:text-indigo-300 px-3 py-1.5 rounded-full font-bold shadow-sm hover:bg-indigo-200 transition flex items-center" title="Pulihkan JSON">
                <i class="fa-solid fa-upload sm:mr-1"></i> <span class="hidden sm:inline">Pulihkan</span>
                <input type="file" id="import-json" class="hidden" accept=".json" onchange="importJSON(event)">
            </label>
            <div class="w-px h-5 bg-gray-300 dark:bg-gray-600 mx-1"></div>
            <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition">
                <i id="theme-icon" class="fa-solid fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow w-full max-w-5xl mx-auto p-4 sm:p-6 flex flex-col gap-6">
        
        <!-- Panel Tambah Jamaah -->
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <h2 class="text-sm font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-4"><i class="fa-solid fa-user-plus mr-1"></i> Registrasi Jamaah Baru</h2>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="jamaah-name" placeholder="Nama Lengkap Jamaah" class="flex-grow p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-medium">
                <select id="jamaah-program" class="p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm cursor-pointer font-medium w-full sm:w-auto">
                    <option value="Yanbua">Metode Yanbua</option>
                    <option value="Qiraati">Metode Qiraati</option>
                    <option value="Tahfiz 30 Juz">Tahfiz 30 Juz</option>
                    <option value="Tilawah & Tahsin">Tilawah & Tahsin</option>
                </select>
                <button onclick="addJamaah()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-lg shadow font-bold transition text-sm whitespace-nowrap flex items-center justify-center">
                    <i class="fa-solid fa-check mr-2"></i> Daftarkan
                </button>
            </div>
        </div>

        <!-- Filter & Statistik Kontrol -->
        <div class="flex flex-col sm:flex-row justify-between items-center bg-gray-100 dark:bg-gray-800/50 p-2 rounded-xl gap-4 border border-gray-200 dark:border-gray-700">
            <div class="flex items-center gap-4 px-3">
                <div class="text-center">
                    <p class="text-[10px] text-gray-500 dark:text-gray-400 font-bold uppercase tracking-wider">Total Jamaah</p>
                    <p class="text-xl font-black text-emerald-600 dark:text-emerald-400 leading-none mt-1" id="stat-total">0</p>
                </div>
            </div>
            <div class="w-full sm:w-auto flex-grow flex justify-end">
                <select id="filter-program" onchange="renderList()" class="w-full sm:w-auto p-2.5 bg-white border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none text-xs font-bold cursor-pointer shadow-sm">
                    <option value="Semua">Tampilkan Semua Kelas</option>
                    <option value="Yanbua">Kelas Yanbua</option>
                    <option value="Qiraati">Kelas Qiraati</option>
                    <option value="Tahfiz 30 Juz">Kelas Tahfiz</option>
                    <option value="Tilawah & Tahsin">Kelas Tilawah</option>
                </select>
            </div>
        </div>

        <!-- Daftar Jamaah -->
        <div id="jamaah-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Data Card akan dimuat di sini -->
        </div>
    </main>

    <!-- MODAL UPDATE PROGRES KOMPREHENSIF -->
    <div id="update-modal" class="fixed inset-0 bg-black/60 z-[100] hidden flex justify-center items-center backdrop-blur-sm p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 w-full max-w-lg rounded-2xl shadow-2xl transform scale-95 transition-transform duration-300" id="update-modal-content">
            
            <div class="bg-gradient-to-r from-emerald-600 to-teal-600 p-4 sm:p-5 rounded-t-2xl flex justify-between items-center">
                <h2 class="text-white font-bold text-lg flex items-center">
                    <i class="fa-solid fa-chart-line mr-2"></i> Evaluasi Jamaah
                </h2>
                <button onclick="closeUpdateModal()" class="text-white hover:text-red-200 transition p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <div class="p-5 sm:p-6 space-y-4">
                <input type="hidden" id="edit-id">
                
                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-1">Nama Jamaah</label>
                    <p id="edit-name" class="text-lg font-black text-gray-900 dark:text-white"></p>
                    <p id="edit-program" class="text-xs font-bold text-blue-600 dark:text-blue-400 mt-1"></p>
                </div>

                <div class="grid grid-cols-2 gap-4 border-t border-gray-200 dark:border-gray-700 pt-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Kehadiran</label>
                        <select id="edit-attendance" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none text-sm font-medium cursor-pointer">
                            <option value="Hadir">✅ Hadir</option>
                            <option value="Izin">ℹ️ Izin</option>
                            <option value="Sakit">🏥 Sakit</option>
                            <option value="Alpa">❌ Alpa (Tanpa Keterangan)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Kualitas Bacaan</label>
                        <select id="edit-quality" class="w-full p-2.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white outline-none text-sm font-medium cursor-pointer">
                            <option value="Lancar">🟢 Lancar (Lulus)</option>
                            <option value="Kurang">🟡 Kurang Lancar</option>
                            <option value="Ulangi">🔴 Mengulang</option>
                            <option value="Belum Dinilai">⚪ Belum Dinilai</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Pencapaian Materi Terakhir</label>
                    <input type="text" id="edit-progress" placeholder="Cth: Jilid 4 Hal 12, atau Juz 30 An-Naba" class="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Catatan Khusus (Tajwid/Makhraj)</label>
                    <textarea id="edit-notes" rows="2" placeholder="Cth: Perhatikan dengung (Ghunnah) dan panjang pendeknya." class="w-full p-3 border rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:ring-2 focus:ring-emerald-500 outline-none text-sm resize-none"></textarea>
                </div>
            </div>

            <div class="bg-gray-50 dark:bg-gray-700/50 p-4 rounded-b-2xl flex justify-end gap-3 border-t border-gray-200 dark:border-gray-600">
                <button onclick="closeUpdateModal()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 dark:bg-gray-600 dark:hover:bg-gray-500 text-gray-800 dark:text-white rounded-lg font-bold text-sm transition">Batal</button>
                <button onclick="saveProgress()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-bold text-sm transition flex items-center shadow-md">
                    <i class="fa-solid fa-save mr-2"></i> Simpan Evaluasi
                </button>
            </div>

        </div>
    </div>

    <script>
        // Inisialisasi Data dari Local Storage
        let dataHalaqah = JSON.parse(localStorage.getItem('halaqah_png_pro')) || [];

        function saveToLocal() {
            localStorage.setItem('halaqah_png_pro', JSON.stringify(dataHalaqah));
            renderList();
        }

        function addJamaah() {
            const nameInput = document.getElementById('jamaah-name');
            const programInput = document.getElementById('jamaah-program');
            const name = nameInput.value.trim();
            const program = programInput.value;

            if (!name) return alert("Nama jamaah tidak boleh kosong!");

            const newJamaah = {
                id: Date.now().toString(),
                name: name,
                program: program,
                progress: "Persiapan Dasar",
                quality: "Belum Dinilai",
                attendance: "Hadir",
                notes: "",
                lastUpdate: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })
            };

            dataHalaqah.push(newJamaah);
            nameInput.value = '';
            saveToLocal();
        }

        function deleteJamaah(id) {
            if (confirm("Data jamaah beserta riwayatnya akan dihapus. Lanjutkan?")) {
                dataHalaqah = dataHalaqah.filter(j => j.id !== id);
                saveToLocal();
            }
        }

        // --- SISTEM MODAL EVALUASI ---
        function openUpdateModal(id) {
            const jamaah = dataHalaqah.find(j => j.id === id);
            if (!jamaah) return;

            document.getElementById('edit-id').value = jamaah.id;
            document.getElementById('edit-name').innerText = jamaah.name;
            document.getElementById('edit-program').innerText = "Program: " + jamaah.program;
            document.getElementById('edit-progress').value = jamaah.progress || "";
            document.getElementById('edit-quality').value = jamaah.quality || "Belum Dinilai";
            document.getElementById('edit-attendance').value = jamaah.attendance || "Hadir";
            document.getElementById('edit-notes').value = jamaah.notes || "";

            const modal = document.getElementById('update-modal');
            modal.classList.remove('hidden');
            setTimeout(() => { 
                modal.classList.remove('opacity-0'); 
                document.getElementById('update-modal-content').classList.remove('scale-95'); 
            }, 10);
        }

        function closeUpdateModal() {
            const modal = document.getElementById('update-modal');
            modal.classList.add('opacity-0');
            document.getElementById('update-modal-content').classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function saveProgress() {
            const id = document.getElementById('edit-id').value;
            const jamaah = dataHalaqah.find(j => j.id === id);
            
            if (jamaah) {
                jamaah.progress = document.getElementById('edit-progress').value.trim() || "Persiapan Dasar";
                jamaah.quality = document.getElementById('edit-quality').value;
                jamaah.attendance = document.getElementById('edit-attendance').value;
                jamaah.notes = document.getElementById('edit-notes').value.trim();
                jamaah.lastUpdate = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                
                saveToLocal();
                closeUpdateModal();
            }
        }

        // --- RENDER DAFTAR KARTU ---
        function renderList() {
            const listEl = document.getElementById('jamaah-list');
            const filterVal = document.getElementById('filter-program').value;
            
            let filteredData = dataHalaqah;
            if (filterVal !== "Semua") {
                filteredData = dataHalaqah.filter(j => j.program === filterVal);
            }

            document.getElementById('stat-total').innerText = filteredData.length;
            listEl.innerHTML = '';

            if (filteredData.length === 0) {
                listEl.innerHTML = `<div class="col-span-full text-center p-8 bg-white dark:bg-gray-800 rounded-xl border border-dashed border-gray-300 dark:border-gray-700 text-gray-500 dark:text-gray-400 italic">Belum ada data jamaah di kategori ini.</div>`;
                return;
            }

            filteredData.forEach(jamaah => {
                // Logika Warna Badge Kualitas
                let qBg = "bg-gray-100 text-gray-600";
                if(jamaah.quality === "Lancar") qBg = "bg-emerald-100 text-emerald-700 border-emerald-200";
                if(jamaah.quality === "Kurang") qBg = "bg-yellow-100 text-yellow-700 border-yellow-200";
                if(jamaah.quality === "Ulangi") qBg = "bg-red-100 text-red-700 border-red-200";

                // Logika Warna Kehadiran
                let attIcon = `<i class="fa-solid fa-check text-emerald-500"></i>`;
                if(jamaah.attendance === "Izin") attIcon = `<i class="fa-solid fa-circle-info text-blue-500"></i>`;
                if(jamaah.attendance === "Sakit") attIcon = `<i class="fa-solid fa-house-medical text-yellow-500"></i>`;
                if(jamaah.attendance === "Alpa") attIcon = `<i class="fa-solid fa-xmark text-red-500"></i>`;

                const card = document.createElement('div');
                card.className = "bg-white dark:bg-gray-800 p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 flex flex-col justify-between hover:shadow-md transition-shadow relative overflow-hidden";
                
                // Pita Indikator Program
                let ribbonColor = "bg-blue-500";
                if(jamaah.program === "Qiraati") ribbonColor = "bg-purple-500";
                if(jamaah.program === "Tahfiz 30 Juz") ribbonColor = "bg-amber-500";
                if(jamaah.program === "Tilawah & Tahsin") ribbonColor = "bg-cyan-500";

                card.innerHTML = `
                    <div class="absolute top-0 left-0 w-1 h-full ${ribbonColor}"></div>
                    
                    <div class="pl-2">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="text-lg font-black text-gray-900 dark:text-gray-100 truncate pr-2">${jamaah.name}</h3>
                            <button onclick="deleteJamaah('${jamaah.id}')" class="text-gray-300 hover:text-red-500 transition focus:outline-none"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                        
                        <div class="flex gap-2 mb-4">
                            <span class="inline-block bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 text-[9px] px-2 py-0.5 rounded font-bold uppercase tracking-wider border border-gray-200 dark:border-gray-600">
                                ${jamaah.program}
                            </span>
                            <span class="inline-block bg-white dark:bg-gray-800 text-[10px] px-2 py-0.5 rounded font-bold border ${qBg}">
                                ${jamaah.quality || "Belum Dinilai"}
                            </span>
                        </div>
                        
                        <div class="bg-gray-50 dark:bg-gray-700/30 p-3 rounded-lg border border-gray-100 dark:border-gray-600 mb-3">
                            <div class="flex justify-between items-center mb-1">
                                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold">Materi Terakhir</p>
                                <span class="text-xs" title="Kehadiran Terakhir">${attIcon}</span>
                            </div>
                            <p class="text-sm font-bold text-gray-800 dark:text-gray-200">${jamaah.progress}</p>
                            
                            ${jamaah.notes ? `
                            <div class="mt-2 pt-2 border-t border-dashed border-gray-200 dark:border-gray-600">
                                <p class="text-[10px] text-gray-500 dark:text-gray-400 uppercase font-bold mb-0.5"><i class="fa-solid fa-thumbtack mr-1"></i> Catatan</p>
                                <p class="text-xs text-gray-600 dark:text-gray-300 italic line-clamp-2">${jamaah.notes}</p>
                            </div>` : ''}
                        </div>
                    </div>
                    
                    <div class="flex justify-between items-center mt-auto pl-2 pt-2">
                        <span class="text-[10px] font-bold text-gray-400 dark:text-gray-500"><i class="fa-regular fa-clock mr-1"></i> ${jamaah.lastUpdate}</span>
                        <button onclick="openUpdateModal('${jamaah.id}')" class="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 dark:bg-emerald-900/30 dark:hover:bg-emerald-800 dark:text-emerald-400 px-4 py-2 rounded-lg text-xs font-bold transition border border-emerald-200 dark:border-emerald-700 shadow-sm flex items-center">
                            <i class="fa-solid fa-pen-to-square mr-1.5"></i> Evaluasi
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // --- SISTEM PEMULIHAN & PENCADANGAN JSON ---
        function exportJSON() {
            if(dataHalaqah.length === 0) return alert("Tidak ada data untuk dicadangkan.");
            const dataStr = JSON.stringify(dataHalaqah, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `HalaqahPro_Backup_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        dataHalaqah = importedData;
                        saveToLocal();
                        alert("Data JSON berhasil dipulihkan secara utuh!");
                    } else {
                        alert("Format JSON tidak valid.");
                    }
                } catch (err) {
                    alert("Gagal membaca file JSON.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // --- TEMA GELAP (DARK MODE) ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const htmlElement = document.documentElement;
        
        themeToggleBtn.addEventListener('click', () => {
            htmlElement.classList.toggle('dark');
            themeIcon.className = htmlElement.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });

        // Inisialisasi awal
        renderList();
    </script>
</body>
</html>
